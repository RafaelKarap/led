function setStatus(kind,msg){const el=$('#status');if(kind==='ok'){el.hidden=true;return}el.hidden=false;$('#statusText').textContent=kind==='connecting'?'Σύνδεση με το σπίτι…':msg}

function connect(){
  const {url,token}=S.cfg;
  if(!url||!token){setStatus('error','Λείπει το token του Home Assistant.');return}
  if(S.ws){S.ws.onclose=null;try{S.ws.close()}catch(e){}}

    const m=JSON.parse(e.data);
    if(m.type==='auth_required')ws.send(JSON.stringify({type:'auth',access_token:token}));
    else if(m.type==='auth_invalid'){ws.onclose=null;ws.close();S.live=false;setStatus('error','Το token δεν έγινε δεκτό. Βάλε νέο στις ρυθμίσεις.')}

  };
  ws.onclose=()=>{S.live=false;setStatus('error','Δεν υπάρχει σύνδεση με το σπίτι. Είναι ανοιχτό το Tailscale;');render();clearTimeout(S.retry);S.retry=setTimeout(connect,6000)};
}
async function boot(){

    if(st.status!=='fulfilled')throw 0;
    S.st=new Map(st.value.map(x=>[x.entity_id,x]));
    S.areas=new Map(ar.status==='fulfilled'?ar.value.map(a=>[a.area_id,a.name]):[]);
    S.reg=new Map(en.status==='fulfilled'?en.value.map(r=>[r.entity_id,r]):[]);
    S.dev=new Map(dv.status==='fulfilled'?dv.value.map(d=>[d.id,d]):[]);

function schedule(){if(S.raf)return;S.raf=requestAnimationFrame(()=>{S.raf=0;render()})}
async function call(dom,svc,id,data={}){

function cleanName(n){const w=String(n).trim().split(/\s+/);const k=w.length/2;if(w.length%2===0&&w.slice(0,k).join(' ').toLowerCase()===w.slice(k).join(' ').toLowerCase())return w.slice(0,k).join(' ');return n}

      if(r&&r.device_id&&washers.has(r.device_id))continue;
      const isSp=id.startsWith('media_player.spotify');

}
function washerInfo(c){

  const jt=job?(JOB[job.state]??job.state):'';
  const text=run?(jt||'Σε λειτουργία'):pause?'Σε παύση':(m&&m.state==='unavailable'?'Μη διαθέσιμο':'Σταματημένο');
  const end=comp&&run&&!isNaN(Date.parse(comp.state))?new Date(comp.state).toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'}):null;
  return {run,pause,mins,text,end};

function stripsOf(c){return c.kind==='ledgrp'?[...S.strips.values()]:[S.strips.get(c.id.slice(4))].filter(Boolean)}
function isLed(c){return c.kind==='led'||c.kind==='ledgrp'}

function tone(c){

function stateText(c){
  if(c.kind==='ledgrp'){const L=stripsOf(c),R=L.filter(s=>s.state==='ready');if(L.some(s=>s.state==='connecting'))return 'Σύνδεση…';if(!R.length)return 'Πάτα για σύνδεση (μόνο στο σπίτι)';const on=R.some(s=>s.on);return (R.length<L.length?`${R.length}/${L.length} συνδεδεμένες, `:'')+(on?`αναμμένες, ${R[0].bri}%`:'σβηστές')}

function hasSheet(c){return ['light','climate','vacuum','washer','led','ledgrp','media_player'].includes(c.kind)}

function render(){

    const t=list.filter(c=>c.kind==='climate').map(c=>S.st.get(c.id)?.attributes.current_temperature).find(v=>typeof v==='number');
    return `<section><div class="roomhead"><h2>${esc(r)}</h2>${t!=null?`<span>${String(t).replace('.',',')}°</span>`:''}</div><div class="grid">${list.map(tile).join('')}</div></section>`;
  }).join(''):`<div class="empty">${S.cfg.token?'Δεν βρέθηκαν συσκευές ακόμα.':'Πάτα το γρανάζι πάνω δεξιά και βάλε το token του Home Assistant για να εμφανιστούν οι συσκευές σου.'}</div>`;
  if(S.sheet&&$('#dlg').open&&document.activeElement?.type!=='range'&&S.sheet.kind==='card')renderSheet();
}

function offAction(c){

  if(c.kind==='climate')return call('climate','turn_off',c.id);

  if(id==='night')return cs.filter(c=>['light','switch','fan','led','ledgrp'].includes(c.kind)||(c.kind==='climate'&&c.area!=='Υπνοδωμάτιο'));
  if(id==='movie')return cs.filter(c=>['light','switch','fan'].includes(c.kind));

async function runMode(id){
  const plan=modePlan(id);plan.forEach(offAction);
  let extra='';
  if(id==='movie'){let n=0;for(const s of S.strips.values())if(s.state==='ready'){s.on=true;s.bri=40;await ledSend(s,F.power(true));await ledColor(s,'#b46bff');await ledSend(s,F.bright(40));n++}if(!n)extra=' (οι ταινίες δεν είναι συνδεδεμένες)'}

    const lights=cards().filter(c=>['light','switch'].includes(c.kind)&&/κεντρικ/i.test(c.name));
    lights.forEach(c=>{if(!isOn(c))call(c.kind,'turn_on',c.id)});
    let n=0;for(const s of S.strips.values())if(s.state==='ready'){s.on=true;s.bri=100;await ledSend(s,F.power(true));await ledColor(s,'#1e90ff');await ledSend(s,F.bright(100));ledPersist(s);n++}
    toast(`Work mode: ${lights.length?'το Κεντρικό Φως άναψε':'δεν βρέθηκε Κεντρικό Φως'}${n?', οι ταινίες έγιναν μπλε':' (οι ταινίες δεν είναι συνδεδεμένες)'}`);
    closeSheet();render();return;
  }
  if(id==='elena'){let n=0;for(const s of S.strips.values())if(s.state==='ready'){s.on=true;await ledSend(s,F.power(true));await ledColor(s,'#ff0000');n++}extra=n?', οι ταινίες έγιναν κόκκινες':' (οι ταινίες δεν είναι συνδεδεμένες)';const err=await playUri('spotify:track:3pepZAOvUCBt3qWi9Ax6Aq',48);extra+=err?` · μουσική: ${err}`:', 🎵 παίζει'}

  const m=BUILTIN.find(x=>x.id===id);
  toast(id==='elena'?`${m.name}: ${plan.length?'το Κεντρικό Φως έσβησε':'το Κεντρικό Φως ήταν ήδη σβηστό'}${extra}`:`${m.name}: ${plan.length?`έκλεισαν ${plan.length} ${plan.length===1?'συσκευή':'συσκευές'}`:'όλα ήταν ήδη κλειστά'}${extra}`);

}

function tile(c){
  if(c.kind==='ledadd')return `<div class="tile" role="button" tabindex="0" data-card="ledadd" data-act="ledadd" aria-label="Προσθήκη ταινιών LED"><span class="ic">${svg('led')}</span><div><div class="name">Ταινίες LED</div><div class="st">Πάτα για προσθήκη, μόνο στο σπίτι</div></div></div>`;
  const t=tone(c),s=S.st.get(c.id),na=c.kind!=='led'&&c.kind!=='washer'&&(!s||s.state==='unavailable');
  const det=hasSheet(c);
  if(c.kind==='washer'){
    const w=washerInfo(c),pct=w.run&&w.mins!=null?Math.max(5,Math.min(95,100-Math.round(w.mins/1.5))):0;
    return `<div class="tile wide ${t}" role="button" tabindex="0" data-card="${esc(c.id)}" data-act="open" aria-label="${esc(c.name)}, ${esc(stateText(c))}">
      <div class="wrow"><span class="ic">${svg('washer')}</span><div><div class="name">${esc(c.name)}</div><div class="st">${esc(w.text)}${w.end?`, τελειώνει ${w.end}`:''}</div></div>${w.run&&w.mins!=null?`<span class="big">${w.mins}′</span>`:''}</div>
      ${w.run?`<span class="prog"><span style="width:${pct}%"></span></span>`:''}</div>`;
  }
  let bar='';
  if(isLed(c)){const st=stripsOf(c).find(s=>s.state==='ready'&&s.on);if(st)bar=`<span class="bar" style="background:${st.color};box-shadow:0 0 18px 4px ${st.color}88"></span>`}
  const icon=c.kind==='media_player'?'music':c.kind;
  return `<div class="tile ${t}${na?' off-line':''}" role="button" tabindex="0" data-card="${esc(c.id)}" data-act="${det?'open':'primary'}" aria-label="${esc(c.name)}, ${esc(stateText(c))}">
    ${bar}<button class="ic" data-card="${esc(c.id)}" data-act="primary" aria-label="${esc(c.name)}: εναλλαγή" ${na?'disabled':''}>${svg(icon)}</button>
    ${det?`<span class="more">${svg('dots')}</span>`:''}
    <div><div class="name">${esc(c.name)}</div><div class="st">${esc(stateText(c))}</div></div></div>`;
}

function openSettings(){S.sheet={kind:'settings'};renderSettings();const g=$('#dlg');if(!g.open)g.showModal()}
function closeSheet(){S.sheet=null;const g=$('#dlg');if(g.open)g.close()}
function renderSheet(){
  if(!S.sheet)return;if(S.sheet.kind==='settings')return renderSettings();if(S.sheet.kind==='ledmore')return renderLedMore();if(S.sheet.kind==='mode')return renderModeSheet();
  const c=findCard(S.sheet.id);if(!c){closeSheet();return}
  const sh=$('#sheet');let body='';
  if(isLed(c)){
    const L=stripsOf(c),R=L.filter(s=>s.state==='ready'),st=R[0]||L[0];
    const COLORS=['#ff3b3b','#ff8a1f','#ffd21f','#2fe07a','#1fd8ff','#3b5bff','#b46bff','#ff4fae','#ffffff','#ffc98a','#6b8cff','#7cff9a','#ff6b6b'];
    const conn=L.length>1?`<p class="sub">${L.map(s=>`${esc(s.name)}: ${s.state==='ready'?'συνδεδεμένη':s.state==='connecting'?'σύνδεση…':'αποσυνδεδεμένη'}`).join(' · ')}</p>`:'';
    if(!R.length)body=`<p class="sub">${L.length>1?'Οι ταινίες δεν είναι συνδεδεμένες':'Η ταινία δεν είναι συνδεδεμένη'}. Κλείσε την εφαρμογή duoCo και πάτα σύνδεση, μέσα στο σπίτι.</p><button class="power" data-svc="ledconn">Σύνδεση</button>`;
    else body=`<div class="dots">${COLORS.map(x=>`<button class="dot" style="background:${x}" data-svc="ledcolor" data-v="${x}" aria-label="Χρώμα ${x}" aria-pressed="${st.color===x}"></button>`).join('')}<label class="dot picker" aria-label="Δικό σου χρώμα"><input type="color" data-k="ledpick" value="${st.color}"></label></div>
      <div class="ctl"><label for="lb"><span>Φωτεινότητα</span><span data-out>${st.bri}%</span></label><input id="lb" type="range" min="1" max="100" value="${st.bri}" data-k="ledbri"></div>
      <div class="ctl"><label><span>Εφέ</span><span>${st.effect} από 212</span></label><div class="fx"><button data-svc="fxp" aria-label="Προηγούμενο εφέ">‹</button><div class="num">${st.effect}</div><button data-svc="fxn" aria-label="Επόμενο εφέ">›</button></div></div>
      <button class="power" data-svc="ledpower">${R.some(s=>s.on)?'Σβήσιμο':'Άναμμα'}</button>${R.length<L.length?'<button class="secondary" data-svc="ledconn">Σύνδεση των υπόλοιπων</button>':''}`;
    sh.innerHTML=`<div class="grab"></div><h3>${esc(c.name)}</h3><p class="sub">Σαλόνι, Bluetooth${L.length>1?`, ${L.length} ταινίες μαζί`:''}</p>${conn}${body}`;return;
  }
  if(c.kind==='washer'){
    const w=washerInfo(c);
    body=`<div class="bigt">${w.run&&w.mins!=null?w.mins+'′':'–'}</div><p class="sub" style="text-align:center">${esc(w.text)}${w.end?`, τελειώνει ${w.end}`:''}</p><p class="help">Για εκκίνηση από το κινητό, πάτα πρώτα Smart Control πάνω στο πλυντήριο.</p>`;
    sh.innerHTML=`<div class="grab"></div><h3>${esc(c.name)}</h3><p class="sub">${esc(c.area)}</p>${body}`;return;
  }
  const s=S.st.get(c.id);if(!s){closeSheet();return}const a=s.attributes;
  if(c.kind==='light'){
    const v=s.state==='on'?Math.round((a.brightness||255)/2.55):0;
    const dim=(a.supported_color_modes||[]).some(m=>m!=='onoff');
    body=dim?`<div class="bigt" data-out>${v}%</div><div class="ctl"><label for="lbr"><span>Φωτεινότητα</span></label><input id="lbr" type="range" min="1" max="100" value="${v||1}" data-k="bright"></div>`:'';
    body+=`<button class="power" data-svc="toggle">${s.state==='on'?'Σβήσιμο':'Άναμμα'}</button>`;
  }
  if(c.kind==='climate'){
    const modes=a.hvac_modes||['off','cool','heat'];
    body=`<div class="row" style="align-items:center;gap:22px"><button class="round" data-svc="tdown" aria-label="Μείωση θερμοκρασίας">${svg('down')}</button><div class="bigt">${a.temperature??'–'}°</div><button class="round" data-svc="tup" aria-label="Αύξηση θερμοκρασίας">${svg('up')}</button></div>
      <p class="sub" style="text-align:center">Θερμοκρασία χώρου ${a.current_temperature??'–'}°</p>
      <div class="row">${modes.map(m=>`<button class="pill" data-svc="mode" data-v="${esc(m)}" aria-pressed="${s.state===m}">${esc(MODES[m]||m)}</button>`).join('')}</div>
      <button class="power" data-svc="climpower">${s.state==='off'?'Ενεργοποίηση':'Απενεργοποίηση'}</button>`;
  }
  if(c.kind==='vacuum'){
    const b=a.battery_level??devBattery(c.id);
    body=`<div class="bigt">${b!=null?b+'%':'–'}</div><p class="sub" style="text-align:center">${esc(VAC[s.state]||s.state)}</p>
      <div class="row"><button class="pill" data-svc="vstart">${svg('play').replace('<svg','<svg width="16" height="16"')} Καθάρισε</button><button class="pill" data-svc="vpause">Παύση</button><button class="pill" data-svc="vdock">Στη βάση</button></div>`;
  }
  if(c.kind==='media_player'){
    const v=Math.round((a.volume_level??0)*100),src=a.source_list||[];
    body=`<div class="row" style="margin:6px 0 10px"><button class="round" data-svc="mprev" aria-label="Προηγούμενο">${svg('prev')}</button><button class="round" data-svc="mpp" aria-label="Αναπαραγωγή ή παύση">${svg(s.state==='playing'?'pause':'play')}</button><button class="round" data-svc="mnext" aria-label="Επόμενο">${svg('next')}</button></div>
    <div class="ctl"><label for="mvol"><span>Ένταση</span><span data-out>${v}%</span></label><input id="mvol" type="range" min="0" max="100" value="${v}" data-k="mvol"></div>
    ${src.length?`<div class="ctl"><label><span>Παίζει σε</span></label><div class="row" style="justify-content:flex-start">${src.map(x=>`<button class="pill" data-svc="msrc" data-v="${esc(x)}" aria-pressed="${a.source===x}">${esc(x)}</button>`).join('')}</div></div>`:''}`;
  }
  sh.innerHTML=`<div class="grab"></div><h3>${esc(c.name)}</h3><p class="sub">${esc(c.area)}, ${esc(stateText(c))}</p>${body}`;
}
function spEntity(){return [...S.st.keys()].find(k=>k.startsWith('media_player.spotify'))}
function toUri(link){const m=String(link).match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album|playlist|artist|episode)\/([A-Za-z0-9]+)/);if(m)return `spotify:${m[1]}:${m[2]}`;if(/^spotify:(track|album|playlist|artist|episode):[A-Za-z0-9]+$/.test(link))return link;return null}
async function rawCall(dom,svc,id,data={}){return S.send({type:'call_service',domain:dom,service:svc,service_data:data,target:{entity_id:id}})}
async function spReady(ent){
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const can=()=>((S.st.get(ent)?.attributes.supported_features||0)&512)!==0;
  if(can())return null;
  const sf=S.st.get(ent)?.attributes.supported_features||0;
  if(sf===0)return 'το Home Assistant δεν βλέπει Premium λογαριασμό';
  const src=S.spSource||(S.st.get(ent)?.attributes.source_list||[])[0];
  if(!src)return 'άνοιξε το Spotify στο κινητό και διάλεξε συσκευή στις Ρυθμίσεις';
  try{await rawCall('media_player','select_source',ent,{source:src})}catch(e){return 'δεν βρέθηκε η συσκευή «'+src+'». Άνοιξε το Spotify στο κινητό'}
  for(let i=0;i<6;i++){await wait(1500);try{await rawCall('homeassistant','update_entity',ent)}catch(e){}await wait(700);if(can())return null}
  return 'το Spotify δεν ενεργοποιήθηκε. Άνοιξε την εφαρμογή Spotify στο κινητό';
}
async function playUri(uri,seek){
  if(!S.live)return 'δεν υπάρχει σύνδεση με το σπίτι';
  const ent=spEntity();if(!ent)return 'δεν βρέθηκε το Spotify στο Home Assistant';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const err=await spReady(ent);if(err)return err;
  const cur=S.st.get(ent)?.attributes.source;
  if(S.spSource&&cur&&cur!==S.spSource){try{await rawCall('media_player','select_source',ent,{source:S.spSource});await wait(1500)}catch(e){}}
  try{await rawCall('media_player','play_media',ent,{media_content_id:uri,media_content_type:uri.split(':')[1]==='track'?'music':'playlist'})}catch(e){return e&&e.message||'δεν ξεκίνησε η αναπαραγωγή'}
  if(seek){await wait(2500);try{await rawCall('media_player','media_seek',ent,{seek_position:seek})}catch(e){}await wait(1500);try{await rawCall('homeassistant','update_entity',ent)}catch(e){}await wait(700);if(S.st.get(ent)?.state!=='playing'){try{await rawCall('media_player','media_play',ent)}catch(e){}}}
  return null;
}
async function playSong(i){
  const song=S.songs[i];if(!song)return;
  toast('🎵 Ξεκινάει: '+song.name);
  const err=await playUri(song.uri,0);
  toast(err?'Μουσική: '+err:'🎵 '+song.name);
}

  <button class="secondary" id="addStrip">Προσθήκη ταινίας</button><button class="secondary" id="addStripAll">Δεν εμφανίζεται; Όλες οι συσκευές Bluetooth</button>

const SVC='0000fff0-0000-1000-8000-00805f9b34fb',CHR='0000fff3-0000-1000-8000-00805f9b34fb';
const F={power:on=>on?[0x7e,4,4,1,0,1,0xff,0,0xef]:[0x7e,4,4,0,0,0,0xff,0,0xef],color:h=>{const[r,g,b]=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));return[0x7e,7,5,3,r,g,b,0x10,0xef]},bright:v=>[0x7e,4,1,v,0xff,0xff,0xff,0,0xef],effect:id=>[0x7e,5,3,id,6,0xff,0xff,0,0xef]};
let ledSaved=store.get('led.strips',{});
function ledPersist(s){ledSaved[s.id]={name:s.name,on:s.on,color:s.color,bri:s.bri,effect:s.effect,speed:s.speed??50};store.set('led.strips',ledSaved)}
function ledMsg(e){if(e&&e.name==='NetworkError')return 'Δεν έγινε σύνδεση. Κλείσε την εφαρμογή duoCo και ξαναδοκίμασε.';if(e&&e.name==='NotFoundError')return 'Η ταινία δεν βρέθηκε. Είσαι κοντά της;';return 'Bluetooth: '+(e&&e.message||e)}
async function ledAdd(all){
  try{
    const dev=await navigator.bluetooth.requestDevice(all?{acceptAllDevices:true,optionalServices:[SVC]}:{filters:[{namePrefix:'MELK'},{namePrefix:'ELK'},{namePrefix:'OA21'},{services:[SVC]}],optionalServices:[SVC]});
    const s=ledAttach(dev);ledPersist(s);render();
    S.sheet={kind:'ledmore',name:s.name};renderLedMore();const g=$('#dlg');if(!g.open)g.showModal();
    await ledConnect(s);if(S.sheet&&S.sheet.kind==='ledmore')renderLedMore();
  }catch(e){if(e.name!=='NotFoundError')toast(ledMsg(e))}
}
function ledAttach(dev){
  let s=S.strips.get(dev.id);if(s)return s;
  const p=ledSaved[dev.id]||{};
  s={id:dev.id,dev,char:null,name:p.name||('Ταινία '+(S.strips.size+1)),on:p.on??true,color:p.color||'#b46bff',bri:p.bri??100,effect:p.effect??0,state:'lost',q:Promise.resolve()};
  S.strips.set(dev.id,s);dev.addEventListener('gattserverdisconnected',()=>{s.char=null;s.state='lost';render();setTimeout(()=>{if(document.visibilityState==='visible')ledWatch(s)},3000)});
  return s;
}
async function ledConnect(s,quiet){
  if(s.state==='ready'||s.busy)return;s.busy=true;s.state='connecting';render();
  try{const srv=await s.dev.gatt.connect();const sv=await srv.getPrimaryService(SVC);s.char=await sv.getCharacteristic(CHR);s.state='ready';render();if(!quiet)toast('Συνδέθηκε: '+s.name)}
  catch(e){s.char=null;s.state='lost';render();if(!quiet)toast(ledMsg(e))}
  finally{s.busy=false}
}
function ledWatch(s){
  if(s.state==='ready'||s.busy||s.watching)return;
  if(!s.dev.watchAdvertisements){ledConnect(s,true);return}
  const ac=new AbortController();s.watching=true;
  const done=()=>{s.watching=false;try{ac.abort()}catch(e){}};
  s.dev.addEventListener('advertisementreceived',async()=>{done();await ledConnect(s,true)},{once:true});
  s.dev.watchAdvertisements({signal:ac.signal}).catch(()=>{done();ledConnect(s,true)});
  setTimeout(()=>{if(s.watching){done();ledConnect(s,true)}},12000);
}
async function ledAuto(){
  if(!navigator.bluetooth)return;
  if(!navigator.bluetooth.getDevices){S.autoBt='unsupported';return}
  let devs=[];try{devs=await navigator.bluetooth.getDevices()}catch(e){S.autoBt='unsupported';return}
  const known=devs.filter(d=>ledSaved[d.id]);
  S.autoBt=Object.keys(ledSaved).length&&!known.length?'forgotten':'ok';
  for(const d of known){const s=ledAttach(d);ledWatch(s)}
  render();
}
function ledSend(s,bytes){s.q=s.q.then(async()=>{if(!s.char)return;const d=new Uint8Array(bytes);try{s.char.writeValueWithoutResponse?await s.char.writeValueWithoutResponse(d):await s.char.writeValue(d)}catch(e){toast(ledMsg(e))}});return s.q}
function ledPower(s,on){s.on=on;ledPersist(s);render();return ledSend(s,F.power(on))}
function ledColor(s,h){s.color=h;s.on=true;ledPersist(s);render();return ledSend(s,F.color(h))}

document.addEventListener('click',async e=>{
  const sc=e.target.closest('[data-scene]');if(sc){const id=sc.dataset.scene;call(id.split('.')[0],'turn_on',id);toast('Ενεργοποιήθηκε: '+sc.textContent.trim());return}
  const nv=e.target.closest('[data-nav]');if(nv){if(nv.dataset.nav==='settings'){openSettings();return}S.view=nv.dataset.nav;window.scrollTo(0,0);render();return}
  const md=e.target.closest('[data-mode]');if(md){if(md.dataset.mode==='exit'){S.sheet={kind:'mode',id:'exit'};renderModeSheet();const g=$('#dlg');if(!g.open)g.showModal()}else runMode(md.dataset.mode);return}
  const rmode=e.target.closest('[data-runmode]');if(rmode){runMode(rmode.dataset.runmode);return}
  if(e.target.id==='exitClean'){S.modeClean=e.target.checked;return}
  const sg=e.target.closest('[data-song]');if(sg){playSong(+sg.dataset.song);return}
  const rs2=e.target.closest('[data-rmsong]');if(rs2){S.songs.splice(+rs2.dataset.rmsong,1);store.set('home.songs',S.songs);renderSettings();render();return}
  const ss=e.target.closest('[data-spsrc]');if(ss){S.spSource=ss.dataset.spsrc;store.set('home.spSource',S.spSource);renderSettings();return}
  if(e.target.id==='addSong'){const n=$('#songName').value.trim(),u=toUri($('#songLink').value.trim());if(!n||!u){toast('Βάλε όνομα και σωστό link του Spotify');return}S.songs.push({name:n,uri:u});store.set('home.songs',S.songs);renderSettings();render();toast('Προστέθηκε: '+n);return}
  if(e.target.id==='ledGroupChk'){S.ledGroup=e.target.checked;store.set('home.ledGroup',S.ledGroup);render();return}
  const rm=e.target.closest('[data-room]');if(rm){S.room=rm.dataset.room;render();return}
  const th=e.target.closest('[data-theme]');if(th&&th.tagName==='BUTTON'){S.theme=th.dataset.theme;store.set('home.theme',S.theme);applyTheme();renderSettings();return}
  if(e.target.closest('#settingsBtn')||e.target.closest('#statusBtn')){openSettings();return}
  if(e.target.closest('[data-close]')){closeSheet();render();return}
  if(e.target.id==='addStrip')return ledAdd(false);
  if(e.target.id==='addStripAll')return ledAdd(true);
  const rs=e.target.closest('[data-rmstrip]');if(rs){const s=S.strips.get(rs.dataset.rmstrip);if(s){if(s.dev.gatt.connected)s.dev.gatt.disconnect();S.strips.delete(s.id);delete ledSaved[s.id];store.set('led.strips',ledSaved);if(s.dev.forget)try{await s.dev.forget()}catch(x){}}renderSettings();render();return}
  if(e.target.id==='saveBtn'){
    const url=$('#haUrl').value.trim().replace(/\/+$/,''),token=$('#haTok').value.trim();
    if(!/^https?:\/\//i.test(url)){$('#err').textContent='Η διεύθυνση πρέπει να ξεκινά με https://';return}
    if(!token){$('#err').textContent='Συμπλήρωσε το token.';return}
    S.cfg={url,token};store.set('home.cfg',S.cfg);closeSheet();connect();return;
  }
  if(e.target===$('#dlg')){closeSheet();return}
  const act=e.target.closest('[data-act]');
  if(act&&act.dataset.act==='ledadd'&&!act.closest('dialog')){ledAdd(false);return}
  if(act&&!act.closest('dialog')){const c=findCard(act.dataset.card);if(!c)return;if(act.dataset.act==='open')openSheet(c);else primary(c);return}
  const sv=e.target.closest('[data-svc]');
  if(sv&&S.sheet&&S.sheet.kind==='card'){
    const c=findCard(S.sheet.id);if(!c)return;const k=sv.dataset.svc;
    if(isLed(c)){const L=stripsOf(c),R=L.filter(s=>s.state==='ready');
      if(k==='ledconn')ledConnectAll(L);
      if(k==='ledpower'){const on=!R.some(s=>s.on);R.forEach(s=>ledPower(s,on))}
      if(k==='ledcolor')R.forEach(s=>ledColor(s,sv.dataset.v));
      if(k==='fxn'||k==='fxp'){const ef=((R[0]?R[0].effect:0)+(k==='fxn'?1:212))%213;R.forEach(s=>{s.effect=ef;s.on=true;ledPersist(s);ledSend(s,F.effect(ef))})}
      renderSheet();return}
    const s=S.st.get(c.id);if(!s)return;const a=s.attributes,step=a.target_temp_step||1;
    ({toggle:()=>call(c.kind,'toggle',c.id),
      tup:()=>call('climate','set_temperature',c.id,{temperature:Math.min(a.max_temp??30,(a.temperature??22)+step)}),
      tdown:()=>call('climate','set_temperature',c.id,{temperature:Math.max(a.min_temp??16,(a.temperature??22)-step)}),
      mode:()=>call('climate','set_hvac_mode',c.id,{hvac_mode:sv.dataset.v}),
      climpower:()=>call('climate',s.state==='off'?'turn_on':'turn_off',c.id),
      mpp:()=>call('media_player','media_play_pause',c.id),mnext:()=>call('media_player','media_next_track',c.id),mprev:()=>call('media_player','media_previous_track',c.id),
      msrc:()=>call('media_player','select_source',c.id,{source:sv.dataset.v}),
      vstart:()=>call('vacuum','start',c.id),vpause:()=>call('vacuum','pause',c.id),vdock:()=>call('vacuum','return_to_base',c.id)})[k]?.();
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tile')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.type!=='range')return;const o=e.target.closest('.sheet')?.querySelector('[data-out]');if(o)o.textContent=e.target.value+'%'});
document.addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k||!S.sheet)return;const c=findCard(S.sheet.id);if(!c)return;const v=+e.target.value;
  if(k==='bright')call('light','turn_on',c.id,{brightness_pct:v});
  if(k==='mvol')call('media_player','volume_set',c.id,{volume_level:v/100});
  if(k==='ledbri'){stripsOf(c).filter(s=>s.state==='ready').forEach(s=>{s.bri=v;ledPersist(s);ledSend(s,F.bright(v))});render()}
  if(k==='ledpick'){stripsOf(c).filter(s=>s.state==='ready').forEach(s=>ledColor(s,e.target.value));renderSheet()}
  e.target.blur();
});
document.addEventListener('change',e=>{if(e.target.id==='spSrc'){S.spSource=e.target.value.trim();store.set('home.spSource',S.spSource)}});
$('#dlg').addEventListener('close',()=>{S.sheet=null});
$('#settingsBtn').innerHTML=svg('gear');
document.querySelectorAll('[data-ic]').forEach(el=>el.outerHTML=svg(el.dataset.ic));

applyTheme();setInterval(()=>{if(S.theme==='auto')applyTheme();render()},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(S.cfg.token)connect();else{setStatus('error','Λείπει το token του Home Assistant.');setTimeout(openSettings,400)}
ledAuto();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){ledAuto();if(S.cfg.token&&!S.live)connect()}});
setInterval(()=>{if(document.visibilityState==='visible'&&[...S.strips.values()].some(s=>s.state!=='ready'))ledAuto()},20000);
</script>
</body>
</html>
