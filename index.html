<!doctype html>
<html lang="el" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Σπίτι">
<title>Σπίτι</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=GFS+Neohellenic:wght@400;700&family=Commissioner:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="night"]{--bg:#121A2B;--bg-img:none;--surface:#1E2942;--surface-2:#2A3756;--ink:#E9E6DF;--muted:#A3ADC2;--line:#2E3B5C;--on:#3A3020;--on-ink:#E9E6DF;--on-muted:#E4C48C;--icon-on:#FFB547;--icon-on-ink:#2B1F04;--glow:0 0 0 6px rgba(255,181,71,.2);--cool:#1C3254;--cool-muted:#B9D4F2;--cool-icon:#8EC5FF;--accent:#FFB547;--light:#FFB547;--coolc:#8EC5FF;--plan:#0D1322;--room:#1A2440;--wall:#3A4A70;--radius:18px;--font:"Fira Sans","Segoe UI",Roboto,system-ui,sans-serif;--display:"GFS Neohellenic","Fira Sans",Georgia,serif;--card-border:transparent;--card-shadow:none;--on-shadow:none;--pill:#E9E6DF;--pill-ink:#121A2B;--fs:1;color-scheme:dark}
:root[data-theme="day"]{--bg:#EEF0F3;--bg-img:none;--surface:#FFFFFF;--surface-2:#E4E8EE;--ink:#18202E;--muted:#556074;--line:#DCE1E8;--on:#FFF1D6;--on-ink:#18202E;--on-muted:#7A5A16;--icon-on:#E89A1A;--icon-on-ink:#2B1F04;--glow:0 0 0 6px rgba(232,154,26,.2);--cool:#DDEBFC;--cool-muted:#2F4F7F;--cool-icon:#2F6FD0;--accent:#2F6FD0;--light:#F0A11E;--coolc:#3D86E6;--plan:#DDE2EA;--room:#F7F8FA;--wall:#B7C0CF;--radius:18px;--font:"Fira Sans","Segoe UI",Roboto,system-ui,sans-serif;--display:"GFS Neohellenic","Fira Sans",Georgia,serif;--card-border:transparent;--card-shadow:0 1px 2px rgba(23,32,43,.06);--on-shadow:none;--pill:#18202E;--pill-ink:#FFFFFF;--fs:1;color-scheme:light}
:root[data-theme="fantasy"]{--bg:#e9dab5;--bg-img:radial-gradient(ellipse at 20% 8%,rgba(255,250,235,.65),transparent 50%),radial-gradient(ellipse at 85% 95%,rgba(120,80,30,.2),transparent 55%),radial-gradient(circle at 50% 50%,transparent 62%,rgba(90,60,20,.32) 100%);--surface:rgba(250,242,222,.72);--surface-2:#efe2c4;--ink:#2b1d0e;--muted:#5e4524;--line:#a87a22;--on:#2b1d0e;--on-ink:#f6ecd2;--on-muted:#e2cc98;--icon-on:radial-gradient(circle at 40% 35%,#ffe2a0,#f0a03c 55%,#a8451c);--icon-on-ink:#2b1d0e;--glow:0 0 20px 5px rgba(255,170,60,.55);--cool:#2b1d0e;--cool-muted:#e2cc98;--cool-icon:radial-gradient(circle at 40% 35%,#d8ecff,#6aa0d8 55%,#2a4f7a);--accent:#7a2418;--radius:6px;--font:"EB Garamond",Georgia,serif;--display:"EB Garamond",Georgia,serif;--light:#F0A03C;--coolc:#6AA0D8;--plan:rgba(250,242,222,.55);--room:#EFE2C4;--wall:#6B4F2A;--card-border:#a87a22;--card-shadow:inset 0 0 0 3px #f6ecd2,inset 0 0 0 4px rgba(168,122,34,.5);--on-shadow:inset 0 0 0 3px #2b1d0e,inset 0 0 0 4px rgba(214,170,80,.7);--pill:#2b1d0e;--pill-ink:#f6ecd2;--fs:1.12;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);background-image:var(--bg-img);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:calc(16px*var(--fs));line-height:1.45;-webkit-tap-highlight-color:transparent;min-height:100vh;transition:background-color .3s}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1 .ver{font-family:var(--font);font-size:.36em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:.6em;vertical-align:middle;white-space:nowrap}
h1{font-family:var(--display);font-size:calc(40px*var(--fs));line-height:1;font-weight:700;letter-spacing:-.01em;margin:4px 0 8px}
.summary{color:var(--muted);margin:0}
.summary b{color:var(--ink);font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--card-border);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}
.status{margin-top:14px;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:.92em;display:flex;gap:10px;align-items:center}
.status button{margin-left:auto;border:0;background:var(--pill);color:var(--pill-ink);border-radius:12px;padding:8px 12px;font-weight:600;flex:none}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.scroller::-webkit-scrollbar{display:none}
.scenes{margin-top:20px}
.scene{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:500}
.scene svg{width:18px;height:18px;color:var(--accent)}
.rooms{margin-top:14px;position:sticky;top:env(safe-area-inset-top,0px);background-color:var(--bg);z-index:5;padding-top:8px;padding-bottom:8px}
.chip{flex:none;border:0;border-radius:999px;padding:8px 16px;background:transparent;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
section{margin-top:22px}
.roomhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.roomhead h2{font-size:1.15em;margin:0;font-weight:600}
.roomhead span{color:var(--muted);font-size:.9em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:124px;padding:14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--card-shadow);text-align:left;overflow:hidden}
.tile.wide{grid-column:1/-1;min-height:0}
.tile .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:0;color:var(--muted);flex:none}
:root[data-theme="fantasy"] .tile .ic{background:transparent;border:1.5px solid #6b4f2a}
.tile .ic svg{width:22px;height:22px}
.tile .name{font-weight:600;font-size:.98em;line-height:1.25}
.tile .st{color:var(--muted);font-size:.86em;margin-top:2px}
:root[data-theme="fantasy"] .tile .st{font-style:italic}
.tile.on{background:var(--on);color:var(--on-ink);box-shadow:var(--on-shadow)}
.tile.on .st{color:var(--on-muted)}
.tile.on .ic{background:var(--icon-on);color:var(--icon-on-ink);box-shadow:var(--glow);border:0}
.tile.cool{background:var(--cool);color:var(--on-ink);box-shadow:var(--on-shadow)}
:root[data-theme="day"] .tile.cool{color:var(--ink)}
.tile.cool .st{color:var(--cool-muted)}
.tile.cool .ic{background:var(--cool-icon);color:#0f1d33;box-shadow:0 0 0 6px rgba(113,165,242,.2);border:0}
.tile.off-line{opacity:.55}
.tile .more{position:absolute;top:12px;right:10px;width:28px;height:28px;color:inherit;opacity:.6;display:grid;place-items:center}
.tile .more svg{width:18px;height:18px}
.tile .bar{position:absolute;left:14px;right:14px;top:0;height:5px;border-radius:0 0 4px 4px}
.prog{display:block;height:8px;border-radius:4px;background:rgba(127,140,160,.3);overflow:hidden}
.prog span{display:block;height:100%;background:var(--cool-icon)}
.wrow{display:flex;align-items:center;gap:14px}
.wrow .big{margin-left:auto;font-size:1.3em;font-weight:700}
.empty{background:var(--surface);border-radius:var(--radius);padding:24px;color:var(--muted);text-align:center;margin-top:22px}
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:90vh;background-color:var(--bg);background-image:var(--bg-img);color:var(--ink);border-radius:26px 26px 0 0}
dialog::backdrop{background:rgb(10 14 20/.5)}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet{padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0;font-size:1.4em;font-weight:700}
.sheet .sub{color:var(--muted);margin:2px 0 18px}
.bigt{font-size:3.4em;font-weight:700;letter-spacing:-.03em;text-align:center;margin:6px 0;line-height:1}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{border:1px solid var(--card-border);background:var(--surface);border-radius:14px;padding:12px 16px;font-weight:500;min-width:64px}
.pill[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.round{width:60px;height:60px;border-radius:50%;border:1px solid var(--card-border);background:var(--surface);display:grid;place-items:center}
.round svg{width:24px;height:24px}
.ctl{margin:16px 0}
.ctl label{display:flex;justify-content:space-between;color:var(--muted);font-size:.9em;margin-bottom:4px}
input[type=range]{width:100%;height:40px;accent-color:var(--accent)}
.power{width:100%;margin-top:18px;border:0;border-radius:16px;padding:15px;font-weight:600;background:var(--pill);color:var(--pill-ink)}
.secondary{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:16px;padding:14px;background:transparent;font-weight:500}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:.9em;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.help{color:var(--muted);font-size:.86em;margin:6px 0 0;line-height:1.5}
.err{color:#c4462f;font-size:.9em;min-height:1.2em;margin:6px 0 0}
.sect{margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sect h4{margin:0 0 10px;font-size:1em}
.dots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin:6px 0 4px}
.dot{aspect-ratio:1;border-radius:50%;border:2px solid transparent}
.dot[aria-pressed="true"]{border-color:var(--ink)}
.picker{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.picker input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.fx{display:flex;align-items:center;gap:8px}
.fx button{width:44px;height:44px;border-radius:12px;border:1px solid var(--card-border);background:var(--surface);font-size:1.2em}
.fx .num{flex:1;text-align:center;font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--card-border)}
.list .it button{margin-left:auto;border:0;background:transparent;color:#c4462f;font-weight:500}
.wrap{padding-bottom:120px}
.plan{margin-top:18px;border-radius:22px;background:var(--plan);padding:10px 8px 6px;position:relative}
.plan svg{display:block;width:100%;height:auto}
.plan .rm{cursor:pointer}
.plan .rm:focus-visible{outline:none}
.plan .rm:focus-visible .base{stroke:var(--ink);stroke-width:10}
.plan text{font-family:var(--font)}
.plan .cap{display:flex;justify-content:space-between;align-items:baseline;padding:4px 10px 6px;color:var(--muted);font-size:.86em}
.roomhead h2{font-family:var(--display);font-size:1.45em;font-weight:700}
.list{display:flex;flex-direction:column;border-radius:var(--radius);background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--card-shadow);overflow:hidden}
.rowd{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;min-height:66px;border-top:1px solid var(--line);position:relative;cursor:pointer}
.rowd:first-child{border-top:0}
.rowd .lamp{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;transition:background .25s,box-shadow .25s}
.rowd.on .lamp{background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent),0 0 16px var(--c)}
.rowd .txt{flex:1;min-width:0}
.rowd .name{font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowd .st{color:var(--muted);font-size:.86em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowd.on .st{color:var(--ink);opacity:.8}
.rowd.off-line{opacity:.5}
.tg{width:52px;height:30px;border-radius:15px;border:0;background:var(--surface-2);position:relative;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.tg[aria-pressed="true"]{background:color-mix(in srgb,var(--c,var(--light)) 55%,var(--surface-2))}
.tg[aria-pressed="true"]::after{transform:translateX(22px);background:var(--c,var(--light))}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);font-size:1.15em;line-height:1}
.stepper b{min-width:44px;text-align:center;font-size:1.1em;font-variant-numeric:tabular-nums}
.minib{flex:none;border:0;border-radius:12px;padding:9px 12px;background:var(--surface-2);font-weight:600;font-size:.9em}
.rowd .big{font-family:var(--display);font-size:1.5em;font-weight:700;flex:none}
.rowd .prog{position:absolute;left:16px;right:16px;bottom:6px;height:4px}
.swatch{width:22px;height:22px;border-radius:6px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background-color:var(--bg);background-image:var(--bg-img);border-top:1px solid var(--line);z-index:20}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nav button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;font-size:.78em;font-weight:500}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700}
.nav svg{width:22px;height:22px}
.mode{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:600}
.mode svg{width:18px;height:18px;color:var(--accent)}
.mode.exit{background:#b8432c;border-color:#b8432c;color:#fff}
.mode.exit svg{color:#fff}
body.offline .mode:not(.exit),body.offline .mcard:not(.exit){opacity:.55}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.mcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;min-height:130px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--card-shadow)}
.mcard svg{width:26px;height:26px;color:var(--accent)}
.mcard .n{font-size:1.1em;font-weight:700}
.mcard .d{font-size:.86em;color:var(--muted);line-height:1.35}
.mcard.exit{grid-column:1/-1;background:#b8432c;color:#fff;border-color:#b8432c;box-shadow:none;min-height:0}
.mcard.exit svg,.mcard.exit .d{color:#ffe1d8}
.pagehead{font-size:calc(28px*var(--fs));font-weight:700;margin:6px 0 2px}
.chk{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:12px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
.offlist{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.danger{width:100%;margin-top:18px;border:0;border-radius:16px;padding:15px;font-weight:700;background:#b8432c;color:#fff}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;border:0;border-radius:14px;padding:12px 18px;background:var(--light);color:#2B1F04;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:92vw}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--pill);color:var(--pill-ink);padding:11px 18px;border-radius:14px;font-size:.92em;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span id="greet">Καλησπέρα</span><span class="ver" id="ver"></span></h1>
      <p class="summary" id="summary"></p>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Ρυθμίσεις"></button>
  </header>
  <div class="status" id="status" hidden><span id="statusText"></span><button id="statusBtn">Ρυθμίσεις</button></div>
  <div id="homeView">
  <div class="plan" id="plan"></div>
  <div class="scroller scenes" id="scenes"></div>
  <div class="scroller rooms" id="rooms" role="toolbar" aria-label="Δωμάτια"></div>
  <main id="main"></main>
  </div>
  <div id="modesView" hidden></div>
</div>
<nav class="nav" aria-label="Κύρια πλοήγηση"><div class="in">
  <button data-nav="home" aria-current="page"><span data-ic="home"></span>Σπίτι</button>
  <button data-nav="modes"><span data-ic="mode"></span>Λειτουργίες</button>
  <button data-nav="settings"><span data-ic="gear"></span>Ρυθμίσεις</button>
</div></nav>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<button class="upd" id="upd" hidden>Υπάρχει νέα έκδοση, πάτα για ανανέωση</button>
<div class="toast" id="toast" role="status"></div>
<script>
const I={
light:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
switch:'<path d="M3 12h18M5 12c0-4 3-7 7-7s7 3 7 7M12 12v7M8 19h8"/>',
fan:'<circle cx="12" cy="12" r="1.6"/><path d="M12 10.4C12 6 13 3 15.5 3 18 3 18 7 13.4 11M13.6 12c4.4 0 7.4 1 7.4 3.5S17 18 13 13.4M12 13.6c0 4.4-1 7.4-3.5 7.4S6 17 10.6 13M10.4 12C6 12 3 11 3 8.5S7 6 11 10.6"/>',
climate:'<path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"/>',
vacuum:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/>',
washer:'<rect x="4" y="2" width="16" height="20" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M8 6h.01M11 6h.01"/>',
led:'<rect x="2" y="9" width="20" height="6" rx="3"/><path d="M6 12h.01M10 12h.01M14 12h.01M18 12h.01"/>',
scene:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',

async function spReady(ent){
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const can=()=>((S.st.get(ent)?.attributes.supported_features||0)&512)!==0;
  if(can())return null;
  const sf=S.st.get(ent)?.attributes.supported_features||0;
  if(sf===0)return 'το Home Assistant δεν βλέπει Premium λογαριασμό';
  const src=S.spSource||(S.st.get(ent)?.attributes.source_list||[])[0];
  if(!src)return 'άνοιξε το Spotify στο κινητό και διάλεξε συσκευή στις Ρυθμίσεις';

  for(let i=0;i<6;i++){await wait(1500);try{await rawCall('homeassistant','update_entity',ent)}catch(e){}await wait(700);if(can())return null}
  return 'το Spotify δεν ενεργοποιήθηκε. Άνοιξε την εφαρμογή Spotify στο κινητό';
}
async function playUri(uri,seek){
  if(!S.live)return 'δεν υπάρχει σύνδεση με το σπίτι';
  const ent=spEntity();if(!ent)return 'δεν βρέθηκε το Spotify στο Home Assistant';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const err=await spReady(ent);if(err)return err;
  try{await rawCall('media_player','play_media',ent,{media_content_id:uri,media_content_type:uri.split(':')[1]==='track'?'music':'playlist'})}catch(e){return e&&e.message||'δεν ξεκίνησε η αναπαραγωγή'}
  await wait(2500);
  if(seek){try{await rawCall('media_player','media_seek',ent,{seek_position:seek})}catch(e){}await wait(1200)}
  try{await rawCall('homeassistant','update_entity',ent)}catch(e){}await wait(800);
  if(S.st.get(ent)?.state!=='playing'){try{await rawCall('media_player','media_play',ent)}catch(e){}}
  return null;
}

const SVC='0000fff0-0000-1000-8000-00805f9b34fb',CHR='0000fff3-0000-1000-8000-00805f9b34fb';

function ledMsg(e){if(e&&e.name==='NetworkError')return 'Η ταινία δεν απάντησε. Έλεγξε ότι έχει ρεύμα, ότι η εφαρμογή δεν είναι ανοιχτή και σε καρτέλα του Chrome, ή κλείσε-άνοιξε το Bluetooth.';if(e&&e.name==='NotFoundError')return 'Η ταινία δεν βρέθηκε. Είσαι κοντά της;';return 'Bluetooth: '+(e&&e.message||e)}

function ledAttach(dev){

async function ledConnect(s,quiet){
  if(s.state==='ready'||s.busy)return;s.busy=true;s.state='connecting';render();
  const once=async()=>{const srv=await s.dev.gatt.connect();const sv=await srv.getPrimaryService(SVC);s.char=await sv.getCharacteristic(CHR)};
  try{try{await once()}catch(e1){try{s.dev.gatt.disconnect()}catch(x){}await new Promise(r=>setTimeout(r,1200));await once()}
    s.state='ready';render();if(!quiet)toast('Συνδέθηκε: '+s.name);applyPendingLed()}
  catch(e){s.char=null;s.state='lost';render();if(!quiet)toast(ledMsg(e))}

function ledWatch(s){
  if(s.state==='ready'||s.busy||s.watching)return;
  if(!s.dev.watchAdvertisements){ledConnect(s,true);return}
  const ac=new AbortController();s.watching=true;
  const done=()=>{s.watching=false;try{ac.abort()}catch(e){}};
  s.dev.addEventListener('advertisementreceived',async()=>{done();await ledConnect(s,true)},{once:true});
  s.dev.watchAdvertisements({signal:ac.signal}).catch(()=>{done();ledConnect(s,true)});
  setTimeout(()=>{if(s.watching){done();ledConnect(s,true)}},12000);
}
async function ledAuto(){

  const known=devs.filter(d=>ledSaved[d.id]);

}
function ledSend(s,bytes){s.q=s.q.then(async()=>{if(!s.char)return;const d=new Uint8Array(bytes);try{s.char.writeValueWithoutResponse?await s.char.writeValueWithoutResponse(d):await s.char.writeValue(d)}catch(e){toast(ledMsg(e))}});return s.q}
function ledPower(s,on){s.on=on;ledPersist(s);render();return ledSend(s,F.power(on))}
function ledColor(s,h){s.color=h;s.on=true;ledPersist(s);render();return ledSend(s,F.color(h))}

document.addEventListener('click',async e=>{
  const sc=e.target.closest('[data-scene]');if(sc){const id=sc.dataset.scene;call(id.split('.')[0],'turn_on',id);toast('Ενεργοποιήθηκε: '+sc.textContent.trim());return}
  const nv=e.target.closest('[data-nav]');if(nv){if(nv.dataset.nav==='settings'){openSettings();return}S.view=nv.dataset.nav;window.scrollTo(0,0);render();return}
  const md=e.target.closest('[data-mode]');if(md&&!S.live&&md.dataset.mode!=='exit'){toast('Περίμενε 1–2″ να συνδεθεί με το σπίτι και ξαναπάτα');return}
  if(md){if(md.dataset.mode==='exit'){S.sheet={kind:'mode',id:'exit'};renderModeSheet();const g=$('#dlg');if(!g.open)g.showModal()}else runMode(md.dataset.mode);return}
  const rmode=e.target.closest('[data-runmode]');if(rmode){runMode(rmode.dataset.runmode);return}
  if(e.target.id==='exitClean'){S.modeClean=e.target.checked;return}
  const wc=e.target.closest('[data-wocolor]');if(wc){S.wo.color=wc.dataset.wocolor;store.set('home.wo',S.wo);renderSettings();return}
  if(e.target.id==='woLight'){S.wo.light=e.target.checked;store.set('home.wo',S.wo);return}
  if(e.target.id==='elTvChk'){S.elenaTv=e.target.checked;store.set('home.elenaTv',S.elenaTv);return}
  if(e.target.id==='spOpenChk'){S.spOpen=e.target.checked;store.set('home.spOpen',S.spOpen);return}
  const sg=e.target.closest('[data-song]');if(sg){playSong(+sg.dataset.song);return}
  const rs2=e.target.closest('[data-rmsong]');if(rs2){S.songs.splice(+rs2.dataset.rmsong,1);store.set('home.songs',S.songs);renderSettings();render();return}
  const ss=e.target.closest('[data-spsrc]');if(ss){S.spSource=ss.dataset.spsrc;store.set('home.spSource',S.spSource);renderSettings();return}
  if(e.target.id==='addSong'){const n=$('#songName').value.trim(),u=toUri($('#songLink').value.trim());if(!n||!u){toast('Βάλε όνομα και σωστό link του Spotify');return}S.songs.push({name:n,uri:u});store.set('home.songs',S.songs);renderSettings();render();toast('Προστέθηκε: '+n);return}
  if(e.target.id==='ledGroupChk'){S.ledGroup=e.target.checked;store.set('home.ledGroup',S.ledGroup);render();return}
  const cmd=e.target.closest('[data-cmd]');if(cmd&&!cmd.closest('dialog')){const id=cmd.dataset.card,s=S.st.get(id);if(s){const a=s.attributes,step=a.target_temp_step||1;const t=cmd.dataset.cmd==='tup'?Math.min(a.max_temp??30,(a.temperature??22)+step):Math.max(a.min_temp??16,(a.temperature??22)-step);call('climate','set_temperature',id,{temperature:t})}return}
  const rm=e.target.closest('[data-room]');if(rm){const r=rm.dataset.room;S.room=(rm.closest('#plan')&&S.room===r)?'all':r;render();return}
  const th=e.target.closest('[data-theme]');if(th&&th.tagName==='BUTTON'){S.theme=th.dataset.theme;store.set('home.theme',S.theme);applyTheme();renderSettings();return}
  if(e.target.closest('#settingsBtn')||e.target.closest('#statusBtn')){openSettings();return}
  if(e.target.closest('[data-close]')){closeSheet();render();return}
  if(e.target.id==='addStrip')return ledAdd(false);
  if(e.target.id==='addStripAll')return ledAdd(true);
  const rs=e.target.closest('[data-rmstrip]');if(rs){const s=S.strips.get(rs.dataset.rmstrip);if(s){if(s.dev.gatt.connected)s.dev.gatt.disconnect();S.strips.delete(s.id);delete ledSaved[s.id];store.set('led.strips',ledSaved);if(s.dev.forget)try{await s.dev.forget()}catch(x){}}renderSettings();render();return}
  if(e.target.id==='saveBtn'){
    const url=$('#haUrl').value.trim().replace(/\/+$/,''),token=$('#haTok').value.trim();
    if(!/^https?:\/\//i.test(url)){$('#err').textContent='Η διεύθυνση πρέπει να ξεκινά με https://';return}
    if(!token){$('#err').textContent='Συμπλήρωσε το token.';return}
    S.cfg={url,token};saveCfg();closeSheet();connect();return;
  }
  if(e.target===$('#dlg')){closeSheet();return}
  const act=e.target.closest('[data-act]');
  if(act&&act.dataset.act==='ledadd'&&!act.closest('dialog')){ledAdd(false);return}
  if(act&&!act.closest('dialog')){const c=findCard(act.dataset.card);if(!c)return;if(act.dataset.act==='open')openSheet(c);else primary(c);return}
  const sv=e.target.closest('[data-svc]');
  if(sv&&S.sheet&&S.sheet.kind==='card'){
    const c=findCard(S.sheet.id);if(!c)return;const k=sv.dataset.svc;
    if(isLed(c)){const L=stripsOf(c),R=L.filter(s=>s.state==='ready');
      if(k==='ledconn')ledConnectAll(L);
      if(k==='ledpower'){const on=!R.some(s=>s.on);R.forEach(s=>ledPower(s,on))}
      if(k==='ledcolor')R.forEach(s=>ledColor(s,sv.dataset.v));
      if(k==='fxn'||k==='fxp'){const ef=((R[0]?R[0].effect:0)+(k==='fxn'?1:212))%213;R.forEach(s=>{s.effect=ef;s.on=true;ledPersist(s);ledSend(s,F.effect(ef))})}
      renderSheet();return}
    const s=S.st.get(c.id);if(!s)return;const a=s.attributes,step=a.target_temp_step||1;
    ({toggle:()=>call(c.kind,'toggle',c.id),
      tup:()=>call('climate','set_temperature',c.id,{temperature:Math.min(a.max_temp??30,(a.temperature??22)+step)}),
      tdown:()=>call('climate','set_temperature',c.id,{temperature:Math.max(a.min_temp??16,(a.temperature??22)-step)}),
      mode:()=>call('climate','set_hvac_mode',c.id,{hvac_mode:sv.dataset.v}),
      climpower:()=>call('climate',s.state==='off'?'turn_on':'turn_off',c.id),
      tvpower:()=>call('media_player',['off','standby'].includes(s.state)?'turn_on':'turn_off',c.id),
      mpp:()=>call('media_player','media_play_pause',c.id),mnext:()=>call('media_player','media_next_track',c.id),mprev:()=>call('media_player','media_previous_track',c.id),
      msrc:()=>call('media_player','select_source',c.id,{source:sv.dataset.v}),
      vstart:()=>call('vacuum','start',c.id),vpause:()=>call('vacuum','pause',c.id),vdock:()=>call('vacuum','return_to_base',c.id)})[k]?.();
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tile')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{
  if(e.target.id==='woAc'){let v=+e.target.value;if(v>0&&v<16)v=16;S.wo.ac=v;store.set('home.wo',S.wo);$('#woAcOut').textContent=v?v+'°':'Χωρίς αλλαγή';return}
  if(e.target.id==='elDelay'){S.elenaDelay=+e.target.value;store.set('home.elenaDelay',S.elenaDelay);$('#elDelayOut').textContent=S.elenaDelay+'″';return}
  if(e.target.id==='elSeek'){S.elenaSeek=+e.target.value;store.set('home.elenaSeek',S.elenaSeek);$('#elSeekOut').textContent=Math.floor(S.elenaSeek/60)+':'+String(S.elenaSeek%60).padStart(2,'0');return}if(e.target.type!=='range')return;const o=e.target.closest('.sheet')?.querySelector('[data-out]');if(o)o.textContent=e.target.value+'%'});
document.addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k||!S.sheet)return;const c=findCard(S.sheet.id);if(!c)return;const v=+e.target.value;
  if(k==='bright')call('light','turn_on',c.id,{brightness_pct:v});
  if(k==='mvol')call('media_player','volume_set',c.id,{volume_level:v/100});
  if(k==='ledbri'){stripsOf(c).filter(s=>s.state==='ready').forEach(s=>{s.bri=v;ledPersist(s);ledSend(s,F.bright(v))});render()}
  if(k==='ledpick'){stripsOf(c).filter(s=>s.state==='ready').forEach(s=>ledColor(s,e.target.value));renderSheet()}
  e.target.blur();
});
document.addEventListener('change',e=>{if(e.target.id==='woPick'){S.wo.color=e.target.value;store.set('home.wo',S.wo);return}if(e.target.id==='woLink'){const v=e.target.value.trim();if(v&&!toUri(v)){toast('Το link του Spotify δεν αναγνωρίστηκε');return}S.wo.link=v;store.set('home.wo',S.wo);toast(v?'Αποθηκεύτηκε η μουσική':'Χωρίς μουσική');return}if(e.target.id==='elYt'){const v=e.target.value.trim();if(!ytId(v)){toast('Το link του YouTube δεν αναγνωρίστηκε');return}S.elenaYt=v;store.set('home.elenaYt',v);toast('Αποθηκεύτηκε το βίντεο');return}if(e.target.id==='spSrc'){S.spSource=e.target.value.trim();store.set('home.spSource',S.spSource)}});
$('#dlg').addEventListener('close',()=>{S.sheet=null});
$('#settingsBtn').innerHTML=svg('gear');
$('#ver').textContent='v'+APP_VERSION;
async function checkUpdate(){
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(j.v>APP_VERSION){$('#upd').hidden=false}}catch(e){}
}
$('#upd').addEventListener('click',async()=>{
  $('#upd').textContent='Ανανέωση…';
  try{const rs=await navigator.serviceWorker?.getRegistrations?.();for(const r of rs||[])await r.unregister();const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  location.replace(location.pathname+'?v='+Date.now());
});
checkUpdate();setInterval(()=>{if(document.visibilityState==='visible')checkUpdate()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
document.querySelectorAll('[data-ic]').forEach(el=>el.outerHTML=svg(el.dataset.ic));

applyTheme();setInterval(()=>{if(S.theme==='auto')applyTheme();render()},60000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
(async()=>{
  await loadSnap();
  if(!S.cfg.token){const b=await idb.get('home.cfg');if(b&&b.token){S.cfg=Object.assign({url:DEFAULT_URL},b);store.set('home.cfg',S.cfg)}}
  else idb.set('home.cfg',S.cfg);
  if(S.cfg.token)connect();else{setStatus('error','Λείπει το token του Home Assistant.');setTimeout(openSettings,400)}
})();
ledAuto();
setInterval(()=>{if(document.visibilityState==='visible')healthCheck()},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){S.hiddenAt=Date.now();return}if(document.visibilityState==='visible'){if(S.hiddenAt&&Date.now()-S.hiddenAt>2000)healthCheck();ledAuto();applyPendingLed();if(S.cfg.token&&!S.live)connect()}});
setInterval(()=>{if(document.visibilityState==='visible'&&[...S.strips.values()].some(s=>s.state!=='ready'))ledAuto()},20000);
</script>
</body>
